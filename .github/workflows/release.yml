# Builds the mod and publishes the jar as a GitHub release.
# Run manually (Actions -> release -> Run workflow) to release the version from gradle.properties,
# or publish a release in the web UI to have the jar attached to it.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish jar
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar --clobber
          else
            version=$(grep '^version=' gradle.properties | cut -d= -f2)
            gh release create "v$version" build/libs/*.jar \
              --target "$GITHUB_SHA" \
              --title "Sell Macro $version" \
              --notes-file .github/release-notes.md
          fi
