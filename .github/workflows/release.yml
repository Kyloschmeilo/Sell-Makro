# Builds the mod and attaches the jar to a GitHub release.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the jar to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  upload-jar:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: upload jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/libs/*.jar --clobber
